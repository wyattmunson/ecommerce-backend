apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-backend
  namespace: ecommerce
spec:
  # Adjust the class and host for your cluster's ingress controller.
  ingressClassName: nginx
  rules:
    - host: ecommerce.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecommerce-backend
                port:
                  name: http
